{{ define "main" }}
{{ with .Content }}
<div class="intro">{{ . }}</div>
{{ end }}

<ul class="ideas-list">
  {{ range .Pages }}
  <li>
    <span class="bullet">➜</span>
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    <span class="date">[{{ .Date.Format "2006-01-02" }}]</span>
  </li>
  {{ end }}
</ul>
{{ end }}
